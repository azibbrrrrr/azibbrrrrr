name: Metrics

on:
  schedule:
    - cron: "0 16 * * *" # daily, 00:00 Malaysia time
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Aggregate stats across owned, collaborator and organisation repos (private included).
      # Only totals and language shares are rendered; no private repo names.
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: azibbrrrrr
          filename: metrics.stats.svg
          template: classic
          base: header, activity, repositories
          config_timezone: Asia/Kuala_Lumpur
          repositories_affiliations: owner, collaborator, organization_member
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_limit: 8

